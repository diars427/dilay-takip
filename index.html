<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YKS Dilay Takip</title>
<meta name="theme-color" content="#151a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dilay Takip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0f1219;--p:#181c27;--p2:#202533;--p3:#2a3042;--line:#2b3144;--ink:#eceef5;--mut:#9aa1b6;--acc:#4f8cff;--gold:#ffcd5a;--g:#2ea05a;--g2:#6edc96;--r:#e05555;--r2:#ff8c8c;--y:#e8a33a;--blue:#78c8ff;--o:#e8710a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header.ust{position:sticky;top:0;z-index:30;background:#151a2b;color:#fff;padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-left)) 0}
.ust .r1{display:flex;align-items:center;gap:10px;max-width:1500px;margin:0 auto}
.ust h1{font-size:16px;margin:0;white-space:nowrap}.ust .sp{flex:1}
.ust .cd{font-size:12px;color:#c5cbe0;white-space:nowrap}.ust .cd b{color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#888;flex:none}.dot.on{background:#3ccf7a}.dot.off{background:#e05555}.dot.t{background:#ffcd5a}
.ust nav{display:flex;gap:2px;max-width:1500px;margin:6px auto 0;overflow-x:auto}
.ust nav a{color:#aab1c7;text-decoration:none;padding:9px 14px;font-weight:700;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.ust nav a.on{color:#fff;border-color:#4f8cff}
.gomulu header.ust nav{display:none}.gomulu header.ust{padding-bottom:8px}
main{max-width:1500px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left))}
h2{font-size:18px;margin:0}h3{font-size:12.5px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut)}.sm{font-size:12px}
.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--p2);color:var(--ink);border-radius:9px;padding:8px 12px;font:600 13px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ok{background:var(--g);border-color:var(--g);color:#fff}
.btn.no{background:transparent;border-color:var(--r);color:var(--r2)}.btn.sm{padding:5px 9px;font-size:12px}.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--p2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:16px;width:100%}
textarea{min-height:90px;resize:vertical;font-size:15px}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--p3);color:var(--mut)}
.chip.ok{background:rgba(46,160,90,.18);color:var(--g2)}.chip.r{background:rgba(224,85,85,.16);color:var(--r2)}.chip.y{background:rgba(255,205,90,.16);color:var(--gold)}.chip.b{background:rgba(79,140,255,.18);color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--p);color:var(--ink);border-radius:99px;padding:6px 13px;font:600 13px system-ui,sans-serif;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* giris */
.giris{max-width:420px;margin:10vh auto;padding:0 16px}.giris .card{padding:24px}
.giris label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
/* haftalik */
.whead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.wlbl{font-weight:800;font-size:15px;color:var(--blue);text-align:center;flex:1;min-width:180px}
.gun{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.gun.bugun{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.gun.kapali{opacity:.7}
.gust{display:flex;gap:8px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}.gad{font-weight:800}
.ghc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
@media (min-width:700px){.ghc{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:1150px){.ghc{grid-template-columns:repeat(12,minmax(0,1fr))}}
.hc{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:5px 6px;min-height:76px;cursor:pointer;display:flex;flex-direction:column;gap:2px;user-select:none;-webkit-user-select:none;min-width:0}
.hc .hn{font-size:11px;font-weight:800;white-space:nowrap;display:flex;justify-content:space-between}
.hc .hp{font-size:10.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1;word-break:break-word}
.hc .hs{font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.bos .hp{color:var(--mut)}.hc.done{background:rgba(46,160,90,.22);border-color:var(--g)}.hc.done .hs{color:var(--g2);font-weight:700}
.hc.pasif{opacity:.5}.hc.kk{background:repeating-linear-gradient(135deg,var(--p2) 0 6px,var(--bg) 6px 12px);cursor:default}.hc.kk .hp{color:var(--mut);font-weight:700}
.hc.secili{outline:3px dashed #e78bff;outline-offset:1px}.hc.over{outline:3px solid var(--acc)}.hc.drag{opacity:.4}
.hc.hedef{outline:2px dashed var(--acc)}
.selbar{position:sticky;top:96px;z-index:20;background:#2a2142;border:1px solid #b06cff;color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gomulu .selbar{top:8px}
/* kaynak atama paneli */
.kpanel{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--p);border-left:1px solid var(--line);z-index:60;display:none;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.35)}
.kpanel.on{display:flex}.kpanel .kh{padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.kpanel .kl{overflow:auto;flex:1;padding:6px 10px calc(20px + env(safe-area-inset-bottom))}
.kr{display:flex;gap:8px;align-items:center;padding:9px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13.5px}
.kr:hover{background:var(--p2)}.kr.sec{background:rgba(79,140,255,.18);outline:1px solid var(--acc)}
.kr.bas{font-weight:800;background:var(--p2);cursor:default;font-size:12.5px;color:var(--mut)}
.kr .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.kr .ck.on{background:var(--g);border-color:var(--g)}.kr .n{flex:1;min-width:0}.kr .p{font-size:11px;color:var(--mut)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,8,14,.62);display:none;z-index:100;align-items:flex-start;justify-content:center;padding:max(3vh,env(safe-area-inset-top)) 10px 20px;overflow:auto}
.modal.on{display:flex}#modal2{z-index:120}
.mbox{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.mbox.dar{width:min(460px,100%)}
.mh{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.mt{flex:1;text-align:center;font-weight:800;color:var(--blue);font-size:15px;min-width:180px}
.prow{display:grid;grid-template-columns:26px 58px minmax(0,1fr);gap:6px;align-items:center;margin:6px 0}
.prow input[type=checkbox]{width:22px;height:22px;accent-color:var(--g);justify-self:center}.prow .dk{text-align:center;padding:9px 4px}
.prow.d .ad{text-decoration:line-through;color:var(--mut)}
.ctx{position:fixed;z-index:200;background:var(--p);border:1px solid var(--line);border-radius:10px;padding:5px;display:none;min-width:240px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.ctx.on{display:block}.ctx button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px;border-radius:7px;font:14px system-ui,sans-serif;cursor:pointer}
.ctx button:hover{background:var(--p3)}.ctx button.r{color:var(--r2)}.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}.ctx .ch{font-size:11px;color:var(--mut);padding:4px 10px;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#232a3e;color:#fff;border-radius:12px;padding:10px 14px;display:none;gap:12px;align-items:center;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:92vw}
#toast.on{display:flex}#toast button{background:#4f8cff;border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
/* kaynaklar */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.book{background:var(--p);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.book .cv{height:150px;background:var(--p2) center/contain no-repeat;border-bottom:1px solid var(--line)}
.book .bd{padding:8px 9px 10px}.book .nm{font-size:12.5px;font-weight:600;line-height:1.25;height:32px;overflow:hidden}
.bar{height:6px;border-radius:3px;background:var(--line);margin:7px 0 4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
.row2{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mut)}.row2 b{color:var(--ink)}
.kd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media (max-width:600px){.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--mut)}
.srow{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:13px}.srow .t{width:110px;flex:none}.srow .bar{flex:1;margin:0}.srow .v{width:40px;text-align:right;color:var(--mut);font-size:12px}
.hd{display:flex;gap:12px;margin-bottom:12px}.hd .cv{width:96px;height:140px;flex:none;background:var(--p2) center/contain no-repeat;border-radius:8px}
.trow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center;cursor:pointer}
.trow .n{flex:1;min-width:0}.trow .p{color:var(--mut);flex:none;font-size:12px;text-align:right}
.trow.sec{font-weight:700;background:var(--p2);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}.trow.ch{padding-left:14px}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.cb.on{background:var(--g);border-color:var(--g)}.cb.half{border-color:var(--y)}.cb.mix{background:var(--y);border-color:var(--y)}
.kc{display:flex;flex-wrap:wrap;gap:6px}.kc span{color:#fff;border-radius:7px;padding:3px 8px;font-size:12px}
table.tb{border-collapse:collapse;width:100%}table.tb td,table.tb th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}table.tb .r{text-align:right}
/* denemeler */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-bottom:8px}
.dcard{background:var(--p);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.dcard.done{border-color:var(--g)}
.dcov{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#1f3a5a,#3a2a55);display:flex;align-items:center;justify-content:center;font-weight:800;color:#cfe0ff;overflow:hidden;font-size:18px}
.dcov img{width:100%;height:100%;object-fit:cover}
.dcov .tik{position:absolute;top:6px;right:6px;background:var(--g);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800}
.dcn{padding:8px 10px 2px;font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcm{display:flex;gap:6px;align-items:center;padding:4px 10px 10px;flex-wrap:wrap}.dcm .net{font-weight:800;color:var(--g2)}
.week h4{margin:14px 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.alan{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:var(--p2)}
.alan .ah{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.alan .ah b{font-size:15px}.alan .num{display:flex;gap:6px;align-items:center}
.alan .num input{width:62px;padding:7px 5px;text-align:center;font-size:15px}
.qg{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
@media (max-width:420px){.qg{grid-template-columns:repeat(8,minmax(0,1fr))}}
.qg button{border:1px solid var(--line);background:var(--p);color:var(--ink);border-radius:7px;padding:7px 0;font:600 12.5px system-ui,sans-serif;cursor:pointer}
.qg button.y{background:#e8706f;border-color:#e8706f;color:#fff}.qg button.k{background:#6b1f2a;border-color:#6b1f2a;color:#fff}.qg button.b{background:#9a7420;border-color:#9a7420;color:#fff}
.qg .ayr{grid-column:1/-1;font-size:11px;color:var(--mut);margin-top:4px}
.qg button.d{background:rgba(46,160,90,.28);border-color:rgba(46,160,90,.6);color:var(--ink)}
.qg button.det{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #c9a7ff;position:relative}
.qg button.det::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:#e2d0ff}
.lg{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.lg.d{background:rgba(46,160,90,.6)}.lg.y{background:#e8706f}.lg.k{background:#6b1f2a}.lg.b{background:#9a7420}.lg.det{background:var(--p);box-shadow:0 0 0 2px #c9a7ff}
.soru{background:#fff;color:#111;border-radius:10px;padding:10px;overflow:auto}.soru img{max-width:100%;height:auto;display:block;margin:6px 0}
.cozum{background:var(--p2);border-radius:10px;padding:10px;margin-top:8px;overflow:auto}.cozum img{max-width:100%}
.pdfv{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.dbig{display:flex;gap:14px;flex-wrap:wrap}.dbig .cv2{width:150px;flex:none;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1f3a5a,#3a2a55);display:flex;align-items:center;justify-content:center;color:#cfe0ff;font-weight:800}
.dbig .cv2 img{width:100%;height:100%;object-fit:cover}
.trend{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:8px}.trend div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-width:6px;position:relative}
.trend div span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.ro .yalniz{display:none}
.dcov .dsil{position:absolute;bottom:6px;right:6px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;padding:4px 7px;cursor:pointer;font-size:13px}
.pq{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0;background:var(--p);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer}
.pq-sol{padding:12px}.pq-bos{border-left:2px dashed var(--line);padding:10px;color:var(--mut);font-size:12px;min-height:160px}
.baski-baslik{display:none}
@media (max-width:640px){.pq{grid-template-columns:1fr}.pq-bos{display:none}}
@media print{
  .notk{break-inside:avoid;border:1px solid #bbb;background:#fff}.notk img{max-height:none}
  header.ust,#toast,.noprint,.chips,#kpanel,.modal,#ctx,#yksbar{display:none!important}
  body{background:#fff!important;color:#000!important;padding:0}main{padding:0}
  .baski-baslik{display:block;font-weight:800;font-size:15px;margin:0 0 10px}
  .pq{grid-template-columns:58% 42%!important;border:1px solid #999;background:#fff;break-inside:avoid;page-break-inside:avoid;border-radius:6px}
  .pq-bos{display:block!important;border-left:1px dashed #888;min-height:260px;color:#888}
  .pq .chip{border:1px solid #999;background:#fff!important;color:#000!important}
  .soru{border:0;padding:0}
}.pdfkap{width:190mm;background:#fff;color:#000;font:13px/1.45 system-ui,"Segoe UI",sans-serif;padding:0}
.pdfkap .baski-baslik{display:block!important;font-weight:800;font-size:15px;margin:0 0 8px}
.pdfkap .pq{display:grid!important;grid-template-columns:58% 42%;border:1px solid #999;border-radius:6px;background:#fff;margin-bottom:8px;break-inside:avoid;page-break-inside:avoid}
.pdfkap .pq-sol{padding:8px}.pdfkap .pq-bos{display:block!important;border-left:1px dashed #888;min-height:240px;color:#888;padding:8px}
.pdfkap .notk{background:#fff;border:1px solid #bbb;border-radius:6px;padding:10px;margin-bottom:8px;break-inside:avoid;color:#000}
.pdfkap .chip{border:1px solid #999;background:#fff!important;color:#000!important}.pdfkap .mut{color:#555!important}
.pdfkap .soru{background:#fff;padding:0}.ib{width:100%;border:0;border-radius:8px;padding:9px 4px;font:700 12.5px system-ui,sans-serif;cursor:pointer;color:#fff;background:#3a4058}.ib.ok{background:#2a8f55}.ib.no{background:#9b3434}
#nav{scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
.seg{display:inline-flex!important;background:#232a40;border-radius:99px;padding:3px;gap:2px;align-items:center}.seg button{border:0;background:none;color:#aab1c7;border-radius:99px;padding:4px 12px;font:700 12px system-ui,sans-serif;cursor:pointer}.seg button.on{background:#4f8cff;color:#fff}
main.oniz::before{content:'👁 Önizleme: paylaştığın kişiler uygulamayı böyle görüyor';display:block;background:#2a2142;border:1px solid #b06cff;color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
#rolc{white-space:nowrap}@media (max-width:420px){.ust .cd{display:none}}
</style></head>
<body>
<header class="ust"><div class="r1"><span class="dot" id="sdot" title="Senkron"></span><h1>YKS Dilay Takip</h1><span class="chip" id="rolc"></span><span class="sp"></span><span class="cd" id="ucd"></span><button class="btn sm" id="menu" style="background:transparent;color:#fff;border-color:#3a4260">⋯</button></div>
<nav id="nav"><a href="#plan" data-t="plan">Haftalık Plan</a><a href="#kaynak" data-t="kaynak">Kaynaklar</a><a href="#deneme" data-t="deneme">Denemeler</a></nav></header>
<main id="app"><div class="giris"><div class="card"><h2>YKS Dilay Takip</h2><p class="mut">Yükleniyor…</p></div></div></main>
<div id="kpanel" class="kpanel"></div>
<div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>
<div id="modal2" class="modal"><div class="mbox dar" id="mbox2"></div></div>
<div id="ctx" class="ctx"></div>
<div id="toast"><span id="tmsg"></span><button id="tbtn">Geri al</button></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="bulut.js"></script>
<script src="kaynak-veri.js"></script>
<script src="deneme-veri.js"></script>
<script>
'use strict';
/* ====== ortak ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const p2 = n => String(n).padStart(2, '0');

let hafta = null, secili = null, surukKey = null, atanacak = null;

  for (let d = PB; d < TYT && d <= now; d = addD(d, 1)) for (let no = 1; no <= 12; no++) {

function degerlendir(rec) {
